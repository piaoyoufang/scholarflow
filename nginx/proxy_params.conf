# ============================================================
# 转发给后端时统一使用的代理请求头（被 nginx.conf 各 location include）
#
# 安全要点 1：X-Forwarded-For 写成 $remote_addr，不要写 $proxy_add_x_forwarded_for。
#   $proxy_add_x_forwarded_for 会把客户端自带的 X-Forwarded-For 头原样拼进来，
#   攻击者伪造这个头就能冒充任意 IP、绕过限流。
#   $remote_addr 是 Nginx 自己算出来的地址（经 real_ip 还原后就是真实用户 IP），可信。
#
# 安全要点 2：后端 uvicorn 需要开启 --forwarded-allow-ips 才会读 X-Forwarded-For，
#   否则 request.client.host 永远是 Nginx 容器的内网 IP，所有人共用同一个限流桶。
# ============================================================

proxy_http_version 1.1;

proxy_set_header Host $host;

# 真实客户端 IP（经 nginx.conf 里的 real_ip 配置还原）
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Cloudflare 原始 IP 头，透传给后端仅用于日志排查
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

# 关闭缓冲：后端流式返回（SSE）才能实时推送到浏览器
proxy_buffering off;
proxy_cache off;

# 超时：问答接口会调大模型，给足时间
proxy_connect_timeout 30s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
