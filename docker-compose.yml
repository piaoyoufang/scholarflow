# ============================================================
# Scholarflow 生产环境 Docker Compose
# 唯一对外端口：nginx:80（Cloudflare HTTPS 自动处理）
# 所有内部服务走 compose 内部网络，不暴露端口到宿主机
# 服务器：腾讯云轻量应用服务器（东京），IP 43.130.247.249
# ============================================================

services:
  # ---------- 中间件 ----------
  mysql:
    image: mysql:8.0
    container_name: scholarflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: scholarflow_root
      MYSQL_DATABASE: scholarflow
      MYSQL_USER: scholarflow
      MYSQL_PASSWORD: scholarflow_pwd
      TZ: Asia/Shanghai
    # 生产环境不对外暴露，内部服务通过容器名 mysql:3306 访问
    # 需要本地临时连时取消注释：- "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uscholarflow", "-pscholarflow_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scholarflow-redis
    # 需要本地临时连时取消注释：ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- 业务服务 ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim
    container_name: scholarflow-api
    env_file:
      - .env.production
    command:
      - python
      - -m
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      # 信任 Nginx 传来的 X-Forwarded-For，这样后端 request.client.host
      # 拿到的是用户真实 IP，而不是 Nginx 容器的内网地址。
      # 之所以敢写 "*"：api 的 8000 端口没有映射到宿主机，
      # 外部无法直连，只有 compose 网络内的 nginx 能访问它。
      - --forwarded-allow-ips
      - "*"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim
    container_name: scholarflow-worker
    env_file:
      - .env.production
    command: ["python", "-m", "arq", "app.tasks.worker.WorkerSettings"]
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 反向代理 + 前端静态文件（唯一对外入口） ----------
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: scholarflow-nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
