# ============================================================
# Scholarflow 生产环境 Nginx 配置
# 职责：前端静态文件托管 + /api 反向代理到 FastAPI
# HTTPS 由 Cloudflare 处理，这里只接 80 端口
# ============================================================

upstream api_backend {
    # docker-compose 内部服务名（nginx 和 api 在同一个 compose 网络里）
    server api:8000;
}

server {
    listen 80;
    server_name luoguanggu777.xyz www.luoguanggu777.xyz;

    # ============================================================
    # 真实客户端 IP 还原（关键：只信任 Cloudflare 的网段）
    #
    # 原理：默认情况下 $remote_addr 是「上一跳」的 IP。
    # 走 Cloudflare 代理后，上一跳就是 CF 节点，拿不到用户真实 IP。
    # real_ip 模块的作用是：当连接来源属于下面这些网段时，
    # 才去读它带来的 CF-Connecting-IP 头，并把这个头里的 IP 当成 $remote_addr。
    #
    # 为什么必须逐个列网段、不能写 0.0.0.0/0：
    # CF-Connecting-IP 是普通 HTTP 头，谁都能伪造。如果信任所有来源，
    # 任何人直连 80 端口发一个 CF-Connecting-IP: 8.8.8.8 就能冒充任意 IP，
    # 限流会被逐个换 IP绕过，日志也全是假 IP。
    #
    # 灰云（DNS only）模式下浏览器直连服务器，请求里没有 CF-Connecting-IP 头，
    # Nginx 会自动退回使用真实连接 IP，所以这套配置对两种模式都有效。
    # ============================================================

    # --- Cloudflare 官方 IPv4 网段 ---
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # --- Cloudflare 官方 IPv6 网段（服务器未启用 IPv6 时可删） ---
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # 从 CF-Connecting-IP 头里取真实 IP（CF 只放一个 IP，不是链）
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # 页面字符集
    charset utf-8;

    # ---------- 前端静态文件 ----------
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式：任何找不到的路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源强缓存（文件名带 hash，缓存 1 年）
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ---------- 后端 API 反向代理 ----------
    # 前端请求 /api/xxx → 转发到后端 /xxx（proxy_pass 末尾的斜杠负责砍掉 /api 前缀）
    location /api/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/;
    }

    # ---------- 后端接口文档 ----------
    location = /docs {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/docs;
    }
    location /docs/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/docs/;
    }
    location = /redoc {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/redoc;
    }
    location = /openapi.json {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/openapi.json;
    }

    # ---------- 健康检查 ----------
    location = /health/ready {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/health/ready;
    }
    location = /health/live {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/health/live;
    }

    # 隐藏 Nginx 版本号（减少暴露信息）
    server_tokens off;
}
